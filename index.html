<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pikachu Ngọc Hồi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fffbe6;color:#222}
header{background:#f9c80e;padding:10px 14px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#fff3b0}
nav button{white-space:nowrap}main{padding:12px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:10px;padding:10px;margin:8px 0;box-shadow:0 1px 3px #0002}
input,select,button{padding:7px;margin:3px 0;font-size:15px;max-width:100%}button{cursor:pointer}
h3{margin:12px 0 4px}small{color:#666}
</style></head><body>
<header>🏓 Pikachu Ngọc Hồi <span id="who" style="float:right;font-weight:400"></span></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const sb=supabase.createClient('https://feyksklghawdljiqopov.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZleWtza2xnaGF3ZGxqaXFvcG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MzU5NTMsImV4cCI6MjEwNjQxMTk1M30.sskFyfBaosN6lUEEmFYbQIbszBAsonWj3KrTyXdQIn0');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,D={},tab='news';
const CAT={MM:'Nam-Nam',MF:'Nam-Nữ',FF:'Nữ-Nữ'},TT={MM:'Nam-Nam',MF:'Nam-Nữ',FF:'Nữ-Nữ',mixed:'Hỗn hợp',team:'Đồng đội'};
const ST={open:'Đang đăng ký',pot_locked:'Đã chốt pot',drawn:'Đã bốc thăm',finished:'Kết thúc',pending:'Chờ',accepted:'Đã chấp nhận',declined:'Từ chối',played:'Đã đánh',expired:'Hết hạn',confirmed:'Đã xác nhận',cancelled:'Đã hủy'};
const P=id=>D.pm[id]?.full_name||'?', B=(id,t)=>id===me.id?`<b>${esc(t||P(id))}</b>`:esc(t||P(id));
const pair=(a,b)=>B(a)+' & '+B(b);
const mon=d=>d.slice(0,7)===new Date().toISOString().slice(0,7);

async function load(){
  await sb.rpc('expire_old');
  const q=async(t,o)=>(await sb.from(t).select('*').order(o||'id',{ascending:false})).data||[];
  const [pr,ra,ma,ch,tn,tp,en,de]=await Promise.all([q('profiles','created_at'),q('ratings','user_id'),q('matches'),q('challenges'),q('tournaments'),q('tournament_players','user_id'),q('entries','team_no'),q('match_deltas','at')]);
  D={pr,ra,ma,ch,tn,tp,en,de,pm:Object.fromEntries(pr.map(p=>[p.id,p]))};
  me=D.pm[me.id]; $('who').textContent=me.full_name+(me.is_admin?' (admin)':'');
}
function overall(u){const r=D.ra.filter(x=>x.user_id===u&&x.games>0);return r.length?r.reduce((s,x)=>s+ +x.elo,0)/r.length:1000}
function top3(g){return D.pr.filter(p=>p.gender===g).map(p=>[p,overall(p.id)]).sort((a,b)=>b[1]-a[1]).slice(0,3)}
const topHtml=(g,l)=>`<div class=card><b>Top 3 ${l}</b>${top3(g).map(([p,e],i)=>`<div>${i+1}. ${B(p.id)} <small>${Math.round(e)}</small></div>`).join('')||'<small>Chưa có</small>'}</div>`;
function movers(){const s={};D.de.filter(d=>mon(d.at)).forEach(d=>s[d.user_id]=(s[d.user_id]||0)+ +d.delta);
  return Object.entries(s).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3)}
function rankIn(u,c){const g=D.pm[u].gender,l=D.ra.filter(r=>r.category===c&&r.games>0&&D.pm[r.user_id].gender===g).sort((a,b)=>b.elo-a.elo);
  const i=l.findIndex(r=>r.user_id===u);return i<0?'—':(i+1)+'/'+l.length}
const mline=m=>`${m.played_at} · ${CAT[m.category]} · ${pair(m.a1,m.a2)} <b>${m.score_a}-${m.score_b}</b> ${pair(m.b1,m.b2)} <small>${ST[m.status]}</small>`;

const views={
news(){const t=new Date().toISOString().slice(0,10);
  return `<h2>🔥 Hot news</h2><div class=card>📅 ${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})}</div>
  ${topHtml('M','Nam')}${topHtml('F','Nữ')}
  <div class=card><b>Top 3 thay đổi thứ hạng tháng này</b>${movers().map(([u,d])=>`<div>${B(u)} <small>${d>0?'+':''}${d} điểm</small></div>`).join('')||'<small>Chưa có</small>'}</div>
  <h3>Thách đấu hôm nay</h3>${D.ch.filter(c=>c.scheduled_at.slice(0,10)===t&&['pending','accepted'].includes(c.status)).map(c=>`<div class=card>${pair(c.a1,c.a2)} vs ${pair(c.b1,c.b2)} <small>${new Date(c.scheduled_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${ST[c.status]}</small></div>`).join('')||'<small>Không có</small>'}`},
me(){const mm=D.ma.filter(m=>m.status!=='cancelled'&&mon(m.played_at)&&[m.a1,m.a2,m.b1,m.b2].includes(me.id));
  const cats=me.gender==='M'?['MM','MF']:['FF','MF'];
  const myT=D.tn.filter(t=>D.tp.some(p=>p.tournament_id===t.id&&p.user_id===me.id));
  const myCh=D.ch.filter(c=>[c.a1,c.a2,c.b1,c.b2].includes(me.id));
  return `<h2>Trang cá nhân</h2>${topHtml('M','Nam')}${topHtml('F','Nữ')}
  <div class=card><b>Thứ hạng của tôi</b>${cats.map(c=>`<div>${CAT[c]}: hạng ${rankIn(me.id,c)} · ${Math.round(D.ra.find(r=>r.user_id===me.id&&r.category===c)?.elo||1000)} điểm</div>`).join('')}</div>
  <div class=card><b>Trận trong tháng (${mm.length})</b>${mm.map(m=>`<div>${mline(m)}</div>`).join('')}</div>
  <h3>Thách đấu</h3>
  <div class=card><select id=cp>${opts(u=>u.id!==me.id)}</select> cùng tôi thách đấu<br><select id=co1>${opts(u=>u.id!==me.id)}</select><select id=co2>${opts(u=>u.id!==me.id)}</select><br><input type=datetime-local id=cd><br><button onclick="mkCh()">Gửi thách đấu</button></div>
  ${myCh.map(c=>{const inc=[c.b1,c.b2].includes(me.id)&&c.status==='pending';return `<div class=card>${pair(c.a1,c.a2)} vs ${pair(c.b1,c.b2)}<br><small>${new Date(c.scheduled_at).toLocaleString('vi-VN')} · ${ST[c.status]}</small>
  ${inc?`<br><button onclick="chSt(${c.id},'accepted')">Chấp nhận</button><button onclick="chSt(${c.id},'declined')">Từ chối</button>`:''}
  ${c.status==='accepted'?`<br><button onclick="fromCh(${c.id})">Nhập kết quả</button>`:''}</div>`}).join('')}
  <h3>Giải đã đăng ký</h3>${myT.map(t=>`<div class=card><b>${esc(t.name)}</b> · ${TT[t.type]} <small>${ST[t.status]}</small>${t.status==='drawn'?teamsHtml(t):t.status==='pot_locked'?potHtml(t):''}</div>`).join('')||'<small>Chưa đăng ký giải nào</small>'}`},
result(){const pend=D.ma.filter(m=>m.status==='pending'&&[m.a1,m.a2,m.b1,m.b2].includes(me.id));
  const ok=m=>me.is_admin||(([m.a1,m.a2].includes(me.id))!==([m.a1,m.a2].includes(m.created_by)));
  return `<h2>Nhập kết quả</h2><div class=card>
  <select id=rc><option value=MM>Nam-Nam</option><option value=MF>Nam-Nữ</option><option value=FF>Nữ-Nữ</option></select><br>
  Đội A: <select id=ra1>${opts()}</select><select id=ra2>${opts()}</select> <input id=rsa type=number min=0 placeholder="Điểm" style="width:70px"><br>
  Đội B: <select id=rb1>${opts()}</select><select id=rb2>${opts()}</select> <input id=rsb type=number min=0 placeholder="Điểm" style="width:70px"><br>
  ${me.is_admin?`<select id=rt><option value="">Trận thường</option>${D.tn.map(t=>`<option value=${t.id}>${esc(t.name)}</option>`).join('')}</select><br>`:''}
  <button onclick="mkMatch()">Gửi kết quả</button><br><small>Một người của đội đối thủ cần xác nhận trong 3 ngày.</small></div>
  <h3>Chờ xác nhận</h3>${pend.map(m=>`<div class=card>${mline(m)}${ok(m)?`<br><button onclick="cf(${m.id})">Xác nhận</button>`:''}</div>`).join('')||'<small>Không có</small>'}
  ${me.is_admin?`<h3>Admin: sửa / hủy trận</h3>${D.ma.filter(m=>m.status!=='cancelled').slice(0,30).map(m=>`<div class=card>${mline(m)}<br><button onclick="adm(${m.id})">Sửa tỷ số</button><button onclick="adm(${m.id},1)">Hủy</button></div>`).join('')}`:''}`},
members(){const g=x=>D.pr.filter(p=>p.gender===x);
  return `<h2>Thành viên</h2><div class=card>Tổng: <b>${D.pr.length}</b> · Nam: <b>${g('M').length}</b> · Nữ: <b>${g('F').length}</b></div>
  ${[['M','Nam'],['F','Nữ']].map(([x,l])=>`<div class=card><b>${l}</b>${g(x).map(p=>`<div>${B(p.id)} <small>${Math.round(overall(p.id))}</small></div>`).join('')}</div>`).join('')}`},
tour(){return `<h2>Giải đấu</h2>${me.is_admin?`<div class=card><b>Tạo giải</b><br><input id=tn placeholder="Tên giải"><br>
  <select id=tt>${Object.entries(TT).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select>
  <select id=tpa><option value=equal>Ngang rank</option><option value=strong_weak>1 mạnh 1 yếu</option></select><br>
  <input type=date id=ts> → <input type=date id=te><br><label><input type=checkbox id=tr checked> Ảnh hưởng xếp hạng</label><br><button onclick="mkTour()">Tạo</button></div>`:''}
  ${[...D.tn].sort((a,b)=>a.start_date<b.start_date?-1:1).map(t=>{const joined=D.tp.some(p=>p.tournament_id===t.id&&p.user_id===me.id),n=D.tp.filter(p=>p.tournament_id===t.id).length;
  return `<div class=card><b>${esc(t.name)}</b> · ${TT[t.type]} · ${t.pairing==='equal'?'Ngang rank':'1 mạnh 1 yếu'}<br><small>${t.start_date} → ${t.end_date} · ${ST[t.status]} · ${n} người · ${t.affects_rank?'Tính xếp hạng':'Không tính xếp hạng'}</small>
  ${t.status==='open'?`<br><button onclick="join(${t.id},${joined})">${joined?'Hủy đăng ký':'Đăng ký'}</button>`:''}
  ${me.is_admin?`<br>${t.status==='open'?`<button onclick="tst(${t.id},'pot_locked')">Chốt pot</button>`:''}${t.status==='pot_locked'?`<button onclick="draw(${t.id})">Bốc thăm</button>`:''}${t.status==='drawn'?`<button onclick="tst(${t.id},'finished')">Kết thúc giải</button>`:''}`:''}
  ${t.status==='pot_locked'?potHtml(t):t.status==='drawn'||t.status==='finished'?teamsHtml(t):''}</div>`}).join('')}`}
};
function opts(f){return D.pr.filter(f||(()=>1)).map(p=>`<option value=${p.id}>${esc(p.full_name)}</option>`).join('')}
function potHtml(t){return '<div><small>Pot:</small> '+D.tp.filter(p=>p.tournament_id===t.id).map(p=>B(p.user_id)).join(', ')+'</div>'}
function teamsHtml(t){const e=D.en.filter(x=>x.tournament_id===t.id),g={};e.forEach(x=>(g[x.team_no]??=[]).push(x.user_id));
  return Object.entries(g).map(([n,us])=>`<div>${t.type==='team'?'Đội '+n:'Cặp '+n}: ${us.map(u=>B(u)).join(' & ')}</div>`).join('')}

const err=e=>e&&alert(e.message);
async function run(p){const r=await p;err(r.error);await load();render()}
window.mkCh=()=>{const v=id=>$(id).value;if(!v('cd'))return alert('Chọn thời gian');if(new Set([me.id,v('cp'),v('co1'),v('co2')]).size<4)return alert('Cần 4 người khác nhau');
  run(sb.from('challenges').insert({a1:me.id,a2:v('cp'),b1:v('co1'),b2:v('co2'),scheduled_at:new Date(v('cd')).toISOString(),created_by:me.id}))};
window.chSt=(id,s)=>run(sb.from('challenges').update({status:s}).eq('id',id));
window.fromCh=async id=>{const c=D.ch.find(x=>x.id===id);await sb.from('challenges').update({status:'played'}).eq('id',id);await load();tab='result';render();
  ['a1','a2','b1','b2'].forEach(k=>$('r'+k).value=c[k])};
window.mkMatch=()=>{const v=id=>$(id).value,u=['ra1','ra2','rb1','rb2'].map(v);if(new Set(u).size<4)return alert('Cần 4 người khác nhau');
  const sa=+v('rsa'),sb2=+v('rsb');if(v('rsa')===''||v('rsb')===''||sa===sb2)return alert('Tỷ số không hợp lệ');
  const t=me.is_admin&&v('rt')?D.tn.find(x=>x.id==v('rt')):null;
  run(sb.from('matches').insert({category:v('rc'),a1:u[0],a2:u[1],b1:u[2],b2:u[3],score_a:sa,score_b:sb2,created_by:me.id,tournament_id:t?.id||null,counts_rank:t?t.affects_rank:true,status:me.is_admin?'pending':'pending'}))
  .then?.(()=>{})};
window.cf=id=>run(sb.rpc('confirm_match',{mid:id}));
window.adm=(id,cancel)=>{let a=0,b=0;if(!cancel){const s=prompt('Tỷ số mới (A-B), ví dụ 11-8');if(!s)return;[a,b]=s.split('-').map(Number);if(isNaN(a)||isNaN(b))return alert('Sai định dạng')}
  run(sb.rpc('admin_set_result',{mid:id,sa:a,sb:b,cancel:!!cancel}))};
window.mkTour=()=>{const v=id=>$(id).value;if(!v('tn')||!v('ts')||!v('te'))return alert('Nhập đủ thông tin');
  run(sb.from('tournaments').insert({name:v('tn'),type:v('tt'),pairing:v('tpa'),start_date:v('ts'),end_date:v('te'),affects_rank:$('tr').checked}))};
window.join=(id,j)=>run(j?sb.from('tournament_players').delete().eq('tournament_id',id).eq('user_id',me.id):sb.from('tournament_players').insert({tournament_id:id,user_id:me.id}));
window.tst=(id,s)=>run(sb.from('tournaments').update({status:s}).eq('id',id));
window.draw=async id=>{const t=D.tn.find(x=>x.id===id);let us=D.tp.filter(p=>p.tournament_id===id).map(p=>D.pm[p.user_id]);
  const gate={MM:'M',FF:'F'}[t.type];if(gate)us=us.filter(u=>u.gender===gate);
  const key=u=>t.type==='MF'||t.type==='mixed'?overall(u.id):overall(u.id);const rows=[];
  if(t.type==='team'){const n=Math.max(2,Math.ceil(us.length/4));let k=0;   // snake draft theo rank, cân bằng giới tính
    for(const g of ['M','F']){us.filter(u=>u.gender===g).sort((a,b)=>key(b)-key(a)).forEach(u=>{const r=Math.floor(k/n),i=k%n;rows.push({tournament_id:id,team_no:(r%2?n-1-i:i)+1,user_id:u.id});k++})}}
  else if(t.type==='MF'){const m=us.filter(u=>u.gender==='M').sort((a,b)=>key(b)-key(a)),f=us.filter(u=>u.gender==='F').sort((a,b)=>key(b)-key(a));
    const n=Math.min(m.length,f.length);for(let i=0;i<n;i++){const j=t.pairing==='equal'?i:n-1-i;rows.push({tournament_id:id,team_no:i+1,user_id:m[i].id},{tournament_id:id,team_no:i+1,user_id:f[j].id})}}
  else{const s=us.sort((a,b)=>key(b)-key(a));const h=Math.floor(s.length/2);
    if(t.pairing==='equal')for(let i=0;i+1<s.length;i+=2)rows.push({tournament_id:id,team_no:i/2+1,user_id:s[i].id},{tournament_id:id,team_no:i/2+1,user_id:s[i+1].id});
    else for(let i=0;i<h;i++)rows.push({tournament_id:id,team_no:i+1,user_id:s[i].id},{tournament_id:id,team_no:i+1,user_id:s[s.length-1-i].id})}
  if(!rows.length)return alert('Chưa đủ người để bốc thăm');
  await sb.from('entries').delete().eq('tournament_id',id);const r=await sb.from('entries').insert(rows);err(r.error);
  if(!r.error)await sb.from('tournaments').update({status:'drawn'}).eq('id',id);await load();render()};

const NAV=[['news','Hot news'],['me','Cá nhân'],['result','Nhập kết quả'],['members','Thành viên'],['tour','Giải đấu']];
function render(){$('nav').innerHTML=NAV.map(([k,l])=>`<button onclick="tab='${k}';render()" ${k===tab?'style="font-weight:700"':''}>${l}</button>`).join('')+'<button onclick="sb.auth.signOut()">Đăng xuất</button>';
  $('app').innerHTML=views[tab]()}
function authView(){$('who').textContent='';$('nav').innerHTML='';
  $('app').innerHTML=`<div class=card><h3>Đăng nhập / Đăng ký</h3><input id=em type=email placeholder=Email><br><input id=pw type=password placeholder="Mật khẩu (≥ 6 ký tự)"><br>
  <input id=fn placeholder="Họ tên (khi đăng ký)"><select id=gd><option value=M>Nam</option><option value=F>Nữ</option></select><br>
  <button id=li>Đăng nhập</button><button id=su>Đăng ký</button></div>`;
  $('li').onclick=async()=>err((await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value})).error);
  $('su').onclick=async()=>{if($('pw').value.length<6||!$('fn').value)return alert('Cần họ tên và mật khẩu ≥ 6 ký tự');
    const r=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:{full_name:$('fn').value,gender:$('gd').value}}});err(r.error);if(!r.error&&!r.data.session)alert('Kiểm tra email để xác nhận tài khoản')}}
sb.auth.onAuthStateChange(async(_,s)=>{if(!s)return authView();me={id:s.user.id};await load();render()});
</script></body></html>
